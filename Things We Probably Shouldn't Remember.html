  .tile .scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,.32) 100%);
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:22px; }
  .tile .label{ font-family:"Noto Serif SC",serif; font-size:19px; color:#fff; letter-spacing:0.08em; text-shadow:0 1px 4px rgba(0,0,0,.35); }

  .page-head{ padding:44px 0 20px; text-align:center; position:relative; }
  .back-btn{ position:absolute; left:22px; top:44px; background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; font-family:inherit; }
  .page-head h1{ font-size:clamp(22px,5vw,28px); letter-spacing:0.06em; }

  .tabs{ display:flex; justify-content:center; gap:10px; margin:20px 0 0; }
  .tab-btn{ border:1px solid var(--line); background:var(--card); color:var(--ink-soft); padding:9px 26px; border-radius:20px; font-family:"Noto Serif SC",serif; font-size:14px; cursor:pointer; }
  .tab-btn.active{ background:var(--ink); color:var(--cream); border-color:var(--ink); }

  section.panel{ display:none; padding:30px 0 70px; }
  section.panel.active{ display:block; }
  .panel .sub{ text-align:center; margin-bottom:22px; }

  .upload-box{ border:1.5px dashed var(--line); border-radius:10px; padding:26px 20px; text-align:center;
    color:var(--ink-soft); font-size:13px; cursor:pointer; margin-bottom:22px; background:var(--card); }
  .upload-box:hover{ border-color:var(--pink-deep); color:var(--ink); }
  .upload-box input{ display:none; }
  .readonly-note{ text-align:center; font-size:12.5px; color:var(--ink-soft); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:22px; }

  /* ---- big ordered frame (p8 recreated in CSS so it can grow) ---- */
  .frame-wrap{ position:relative; border:9px solid var(--f-thin); padding:30px 20px 26px; margin-bottom:10px;
    background-color:#fdfdfd;
    background-image:linear-gradient(rgba(206,124,147,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(206,124,147,.14) 1px, transparent 1px);
    background-size:22px 22px; }
  .fcorner{ position:absolute; background:var(--f-thick); z-index:1; }
  .fcorner.tl-h{ top:-9px; left:-9px; width:32%; height:7%; min-height:16px; }
  .fcorner.tl-v{ top:-9px; left:-9px; width:7%; min-width:16px; height:44%; }
  .fcorner.br-h{ bottom:-9px; right:-9px; width:32%; height:7%; min-height:16px; }
  .fcorner.br-v{ bottom:-9px; right:-9px; width:7%; min-width:16px; height:44%; }
  .fdots{ position:absolute; display:flex; gap:10px; align-items:center; z-index:1; }
  .fdots.tr{ top:-9px; right:8%; }
  .fdots.bl{ bottom:-9px; left:8%; }
  .fdots span{ display:block; border-radius:50%; background:var(--f-dot); }
  .fdots.tr span:nth-child(1){ width:9px; height:9px; }
  .fdots.tr span:nth-child(2){ width:16px; height:16px; }
  .fdots.tr span:nth-child(3){ width:20px; height:20px; }
  .fdots.tr span:nth-child(4){ width:14px; height:14px; }
  .fdots.bl span:nth-child(1){ width:9px; height:9px; }
  .fdots.bl span:nth-child(2){ width:15px; height:15px; }
  .fdots.bl span:nth-child(3){ width:22px; height:22px; }
  .fdots.bl span:nth-child(4){ width:26px; height:26px; }

  .photo-slot{ position:absolute; top:15.3%; left:10.9%; width:81.1%; height:67.5%; overflow:hidden; }
  .photo-slot img{ width:100%; height:100%; object-fit:cover; display:block; }
  .tape{ position:absolute; top:-16px; left:50%; transform:translateX(-50%) rotate(-4deg); width:56px; height:auto; z-index:2; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08)); }
  .frame:nth-child(8n+2) .tape{ transform:translateX(-50%) rotate(4deg); }
  .frame:nth-child(8n+3) .tape{ transform:translateX(-50%) rotate(-3deg); }
  .frame:nth-child(8n+4) .tape{ transform:translateX(-50%) rotate(5deg); }
  .frame:nth-child(8n+5) .tape{ transform:translateX(-50%) rotate(-5deg); }
  .frame:nth-child(8n+6) .tape{ transform:translateX(-50%) rotate(3deg); }
  .frame:nth-child(8n+7) .tape{ transform:translateX(-50%) rotate(-4deg); }
  .frame:nth-child(8n+8) .tape{ transform:translateX(-50%) rotate(4deg); }
  .del{ position:absolute; bottom:-6px; right:2%; font-size:10.5px; color:var(--ink-soft); cursor:pointer; opacity:.7; background:var(--card); padding:2px 6px; border-radius:3px; z-index:3; }
  .del:hover{ opacity:1; color:var(--pink-deep); }
  .empty-note, .load-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 0; grid-column:1/-1; }

  .msg-form{ display:flex; flex-direction:column; gap:10px; margin-bottom:26px; }
  .msg-form textarea{ width:100%; min-height:70px; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); color:var(--ink); font-family:inherit; font-size:14px; resize:vertical; }
  .msg-form textarea:focus{ outline:none; border-color:var(--pink-deep); }

(function(){
  const target = new Date('2027-05-18T00:00:00');
  const diff = Math.ceil((target - new Date()) / 86400000);
  document.getElementById('daysLeft').textContent = diff > 0 ? diff : 0;
  const overlay = document.getElementById('modalOverlay');
  setTimeout(()=> overlay.classList.add('show'), 500);
  document.getElementById('enterBtn').addEventListener('click', ()=> overlay.classList.remove('show'));

  function showView(id){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0,0);
  }
  document.querySelectorAll('.tile').forEach(t=>{ t.addEventListener('click', ()=> showView('view-'+t.dataset.target)); });
  document.querySelectorAll('[data-back]').forEach(b=>{ b.addEventListener('click', ()=> showView('view-landing')); });
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });
})();

function compress(file){
  return new Promise((resolve)=>{
    const img = new Image(); const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    img.onload = () => {
      const maxW = 1100, scale = Math.min(1, maxW/img.width);
      const c = document.createElement('canvas');
      c.width = img.width*scale; c.height = img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>resolve(b), 'image/jpeg', 0.8);
    };
    reader.readAsDataURL(file);
  });
}

function renderDocs(cat, docs){
  const box = document.getElementById('gallery-'+cat);
  box.innerHTML = '';
  if(docs.length === 0){ box.innerHTML = '<div class="empty-note">還沒有照片，上傳第一張吧。</div>'; return; }
  docs.forEach((d, idx)=>{
    const data = d.data();
    const frame = document.createElement('div'); frame.className = 'frame';
    const tape = document.createElement('img'); tape.className = 'tape';
    tape.src = TAPE_IMGS[idx % TAPE_IMGS.length];
    const slot = document.createElement('div'); slot.className = 'photo-slot';
    const img = document.createElement('img'); img.src = '/_blob/' + data.assetId; img.loading = 'lazy';
    slot.appendChild(img); frame.appendChild(tape); frame.appendChild(slot);
    if(window.__canWrite){
      const del = document.createElement('span'); del.className = 'del'; del.textContent = '撤回';
      del.onclick = async () => { try{ await d.ref.delete(); if(window.__assets) await window.__assets.delete(data.assetId); }catch(e){} };
      frame.appendChild(del);
    }
    box.appendChild(frame);
  });
}

async function initCat(cat, db, assets, canWrite){
  const q = db.collection('photos').where('category','==',cat).orderBy('createdAt','desc').limit(300);
  q.onSnapshot(
    snap => renderDocs(cat, snap.docs),
    () => { document.getElementById('gallery-'+cat).innerHTML = '<div class="empty-note">載入失敗，稍後再試一次。</div>'; }
  );
  const uploadSlot = document.getElementById('upload-'+cat);
  if(!canWrite){
    uploadSlot.innerHTML = '<div class="readonly-note">目前你是唯讀身份，只能查看相簿。要上傳的話，請讓相簿主人把你加為協作者。</div>';
    return;
  }
  uploadSlot.innerHTML = '<label class="upload-box">點擊或拖曳照片到這裡上傳（'+(cat==='high'?'高中':'初中')+'）<input type="file" accept="image/*" multiple></label>';
  uploadSlot.querySelector('input').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    for(const f of files){
      try{
        const blob = await compress(f);
        const res = await assets.upload(blob, {type:'image/jpeg'});
        await db.collection('photos').add({ category: cat, assetId: res.id, createdAt: new Date().toISOString() });
      }catch(err){ alert('有一張照片上傳失敗，請再試一次。'); }
    }
    e.target.value = '';
  });
}

function renderMsgs(docs){
  const box = document.getElementById('msgList');
  box.innerHTML = '';
  if(docs.length === 0){ box.innerHTML = '<div class="empty-note">還沒有留言，寫下第一句吧。</div>'; return; }
  docs.forEach(d=>{
    const data = d.data();
    const note = document.createElement('div'); note.className = 'msg-note';
    const p = document.createElement('p'); p.textContent = data.text || '';
    note.appendChild(p);
    if(window.__canWrite){
      const del = document.createElement('span'); del.className = 'del'; del.textContent = '撤回';
      del.onclick = async () => { try{ await d.ref.delete(); }catch(e){} };
      note.appendChild(del);
    }
    box.appendChild(note);
  });
}

async function initBoard2(db, canWrite){
  const q = db.collection('messages').orderBy('createdAt','desc').limit(300);
  q.onSnapshot(snap => renderMsgs(snap.docs), () => { document.getElementById('msgList').innerHTML = '<div class="empty-note">載入失敗，稍後再試一次。</div>'; });
  const sendBtn = document.getElementById('msgSend');
  const input = document.getElementById('msgInput');
  if(!canWrite){ input.disabled = true; input.placeholder = '目前你是唯讀身份，只能查看留言。'; sendBtn.disabled = true; return; }
  sendBtn.addEventListener('click', async () => {
    const text = input.value.trim();
    if(!text) return;
    sendBtn.disabled = true;
    try{ await db.collection('messages').add({ text, createdAt: new Date().toISOString() }); input.value=''; }
    catch(e){ alert('送出失敗，請再試一次。'); }
    sendBtn.disabled = false;
  });
}

async function initApp(){
  const db = await claude.use('db');
  const assets = await claude.use('assets');
  let canWrite = false;
  if(db){
    try{
      const user = await claude.use('user');
      if(user){ canWrite = !!(await user.can('data.write')); } else { canWrite = true; }
    }catch(e){ canWrite = true; }
  }
  window.__assets = assets; window.__canWrite = canWrite;
  if(!db || !assets){
    ['high','middle'].forEach(cat=>{ document.getElementById('gallery-'+cat).innerHTML = '<div class="empty-note">這個檢視環境暫不支援共享相簿，請從已發佈的連結開啟。</div>'; });
    document.getElementById('msgList').innerHTML = '<div class="empty-note">這個檢視環境暫不支援留言板，請從已發佈的連結開啟。</div>';
    return;
  }
  initCat('high', db, assets, canWrite);
  initCat('middle', db, assets, canWrite);
  initBoard2(db, canWrite);
}
initApp();
</script>
